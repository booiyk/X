<style>
:root{--bg:#07090d;--fg:#efede9;--mute:#8d8a85;--line:#23262b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

button{background:none;border:0;cursor:pointer;padding:0}

header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:20px 22px 0;color:#fff;transition:background .3s,color .3s}

.logo{grid-column:1;grid-row:1;font:500 44px/.8 "Times New Roman",Times,serif;letter-spacing:0;padding-bottom:20px}
.hnav{grid-column:2;grid-row:1;display:flex;gap:28px;padding-top:6px;padding-bottom:20px}
.hnav a{border-bottom:1px solid transparent;transition:color .2s}

.hright{grid-column:3;grid-row:1;justify-self:end;padding-top:6px}

.menu>div{padding:16px 0 56px}
.menu a{display:block;font-size:clamp(30px,4.6vw,48px);line-height:1.08}
.menu a:hover{color:#8a8782}
.duo{display:grid;grid-template-columns:1fr 1fr;height:100vh;min-height:560px;background:#000}
.pane{position:relative;isolation:isolate;display:flex;justify-content:space-between;align-items:flex-end;padding:22px;color:#fff;overflow:hidden;background:#000}
.pane::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#000b 0,#0000 30%),linear-gradient(0deg,#000c 0,#0000 38%),#0003}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform-origin:var(--o,50% 40%);animation:kb 20s ease-in-out infinite alternate;transition:filter .6s}

.pane:hover .ph{filter:brightness(1.15)}
.pane span{position:relative;font-size:22px}
.pane i{font-style:normal;transition:transform .3s}
.pane:hover i{transform:translateX(6px)}
.vidsec{position:relative;height:100svh;min-height:520px;overflow:hidden;background:#0b0d10;color:#fff}
.film{position:absolute;inset:0;background:linear-gradient(90deg,#2a2e35,#15181d 45%,#34373d)}
.film::before{content:"";position:absolute;inset:-10%;background:radial-gradient(34% 60% at 68% 62%,#ffffff26,transparent),radial-gradient(30% 50% at 28% 30%,#8fa0b81f,transparent);animation:sway 14s ease-in-out infinite alternate}
.film::after{content:"";position:absolute;inset:-60px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/></svg>");opacity:.22;mix-blend-mode:overlay;animation:grain .5s steps(3) infinite}
.film.real::before,.film.real::after{display:none}
@keyframes sway{to{transform:translateX(6%) scale(1.08)}}
@keyframes grain{to{transform:translate(60px,40px)}}
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vidsec::after{content:"";position:absolute;inset:auto 0 0;height:30%;background:linear-gradient(0deg,#000a,transparent);pointer-events:none}

.ar .pimg{background:none;margin-bottom:14px}

footer{padding:20px 22px;display:flex;gap:24px;flex-wrap:wrap;border-top:1px solid var(--line);color:var(--mute)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:35}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;color:#111;z-index:40;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(22px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px))}
.drawer.on{transform:none}
.dtop{display:flex;justify-content:space-between;font-size:22px;margin-bottom:20px}
.ditems{flex:1;overflow:auto}
.ditem{display:grid;grid-template-columns:72px 1fr auto;gap:14px;padding:16px 0;border-top:1px solid #e5e5e5;align-items:start}

.cl{display:flex;justify-content:flex-end;padding:56px 60px 60px 20px}
.ci{width:100%;max-width:560px}

.bc{display:flex;gap:10px;color:#707070;margin-bottom:28px}

.box{border:1px solid #d9d9d9;border-radius:6px}

.sl{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;margin-bottom:14px}

.dcode{display:flex;gap:10px;margin:22px 0 8px}

.ok{padding-top:60px}.ok h2{font-size:28px;margin-bottom:12px}
#admin{font:600 15px/1.4 "Barlow Condensed","Arial Narrow",Arial,sans-serif}

.atabs button{color:var(--mute)}.atabs button[aria-pressed="true"]{color:var(--fg);border-bottom:1px solid var(--fg)}
.bar2{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.btn-l{border:1px solid #111;padding:13px 16px;font-size:20px}

.ar2 .t{width:56px;height:56px;background:#f5f5f5;display:grid;place-items:center}.ar2 .t img{width:100%;height:100%;object-fit:contain}.ar2 .t svg{width:70%}

  <div class="dtop"><span>Keranjang</span><button id="dclose">Tutup</button></div>
  <div class="ditems" id="ditems"></div>
  <div class="dfoot"><div class="dsub"><span>Subtotal</span><span id="dsum"></span></div><a class="btn-d" id="dgo" href="#/checkout">Checkout</a></div>
</aside>

<script>
document.addEventListener('DOMContentLoaded',()=>{

const VIDEO_SRC="media/video.mp4"; // alamat file video (mp4)
const $=s=>document.querySelector(s),R=n=>'Rp '+n.toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[['baru','Koleksi Baru'],['rtw','Siap Pakai'],['sepatu','Sepatu'],['tas','Tas'],['aksesoris','Aksesoris'],['perhiasan','Perhiasan']];
const V=(d,c='')=>`<svg class="sv ${c}" viewBox="0 0 100 100">${d}</svg>`;
const S={
 tee:V('<path d="M34 12 18 22 8 40l14 7 6-8v49h44V39l6 8 14-7-10-18-16-10c-3 8-9 12-16 12s-13-4-16-12z"/>'),
 hood:V('<path d="M36 10c0 10 6 16 14 16s14-6 14-16l18 12 10 36-14 4-4-14v46H26V48l-4 14-14-4 10-36z"/><path d="M42 30v18M58 30v18"/>'),
 pants:V('<path d="M28 6h44l8 90H54L50 40l-4 56H20z"/><path d="M28 14h44"/>'),
 coat:V('<path d="M36 8 50 22 64 8l20 10 8 40-10 2-2 36H24l-2-36-10-2 8-40z"/><path d="M50 22v72"/>'),
 shoe:V('<path d="M12 62h18l10-22 8 6c8 4 24 8 40 14v14H12z"/><path d="M12 76h76"/>'),
 bag:V('<path d="M20 40h60l6 48H14z"/><path d="M36 40c0-18 28-18 28 0"/>'),
 acc:V('<rect x="8" y="42" width="84" height="14" rx="2"/><rect x="44" y="39" width="12" height="20"/>'),
 gem:V('<circle cx="50" cy="58" r="26"/><circle cx="50" cy="58" r="18"/><path d="M42 32l8-12 8 12"/>','gem')
};
const pic=i=>i.img?`<img src="${esc(i.img)}" alt="" loading="lazy" decoding="async">`:S[i.s];
const DS={
 coat:'Mantel kulit domba panjang. Lapisan twill viskos di badan, kupro bergaris di lengan. Kerah lancip. Saku belah di pinggang. Dibuat di Indonesia.',
 tee:'Kaos katun 240 gsm, cuci enzim. Potongan boxy dengan bahu jatuh. Sablon kecil di dada. Dibuat di Indonesia.',
 hood:'Hoodie fleece 450 gsm dengan bagian dalam disikat. Tudung dua lapis. Kantong kanguru di depan. Dibuat di Indonesia.',
 pants:'Celana twill katun berat dengan potongan longgar. Empat kantong. Pinggang karet dan tali serut di ujung. Dibuat di Indonesia.',
 shoe:'Sepatu kulit sapi dengan sol karet jahit. Ujung tumpul. Lapisan dalam kulit kambing. Dibuat di Indonesia.',
 bag:'Tas kulit sapi berlapis kanvas. Tali dapat diatur. Kancing logam perak antik. Dibuat di Indonesia.',
 acc:'Aksesoris kulit dan logam perak antik. Detail dijahit tangan. Dibuat di Indonesia.',
 gem:'Perhiasan perak 925 dengan finishing antik. Dibuat tangan dalam jumlah terbatas. Dibuat di Indonesia.'
};
const ROWS=[
['pria','rtw','Mantel Kulit Panjang',4950000,'coat',1],['pria','rtw','Kaos Boxy Washed',329000,'tee',1],['pria','rtw','Hoodie Tebal Sunyi',789000,'hood',0],['pria','rtw','Celana Kargo Longgar',649000,'pants',0],
['pria','sepatu','Bot Kulit Hitam',2450000,'shoe',1],['pria','sepatu','Sepatu Derby Tumpul',1890000,'shoe',0],
['pria','tas','Tas Selempang Kulit',1650000,'bag',1],['pria','tas','Tas Tote Kanvas',790000,'bag',0],
['pria','aksesoris','Ikat Pinggang Gesper Tebal',590000,'acc',0],['pria','aksesoris','Syal Wol Arang',690000,'acc',0],
['pria','perhiasan','Cincin Perak Rantai',850000,'gem',0],['pria','perhiasan','Kalung Liontin Perak',1150000,'gem',1],
['wanita','rtw','Mantel Kulit Sintetis',3950000,'coat',1],['wanita','rtw','Kaos Crop Pudar',299000,'tee',1],['wanita','rtw','Hoodie Oversize Debu',759000,'hood',0],['wanita','rtw','Celana Parasut Hitam',599000,'pants',0],
['wanita','sepatu','Sepatu Mary Jane Hitam',1790000,'shoe',1],['wanita','sepatu','Bot Tinggi Kulit',2650000,'shoe',0],
['wanita','tas','Tas Bahu Kulit Lipat',1850000,'bag',1],['wanita','tas','Tas Genggam Mini',990000,'bag',0],
['wanita','aksesoris','Ikat Pinggang Tipis',490000,'acc',0],['wanita','aksesoris','Syal Sutra Hitam',750000,'acc',0],
['wanita','perhiasan','Anting Rantai Perak',650000,'gem',0],['wanita','perhiasan','Gelang Perak Tebal',920000,'gem',1]
];
const DEF=ROWS.map((r,i)=>({id:i,g:r[0],c:r[1],n:r[2],p:r[3],s:r[4],nw:r[5]}));
let ITEMS=DEF,ALL=[],ARC=[],ARCHDB=null,CFG={},ORDERS=[],CAN=false,LOADED=true;
const PM=id=>ITEMS.find(x=>String(x.id)===String(id));
const hs=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0);
const SZ=i=>i.z&&i.z.length?i.z:i.s==='shoe'?['39','40','41','42','43','44']:['tee','hood','pants','coat'].includes(i.s)?['XS','S','M','L','XL','2XL']:['Satu ukuran'];
const sold=(i,k)=>SZ(i).length>1&&(i.x?i.x.includes(SZ(i)[k]):(hs(i.id)+k)%4===0);
const card=i=>`<a class="pcard" href="#/p/${i.id}"><div class="pimg">${pic(i)}</div><b>${esc(i.n)}</b><small>${R(i.p)}</small></a>`;
const AN={coat:['Jaket Kulit Klasik','Mantel Wol Lama'],tee:['Kaos Grafis Lama','Kaos Lengan Panjang'],hood:['Hoodie Zip Lama','Hoodie Bordir'],pants:['Celana Denim Robek','Celana Lipit Wol'],shoe:['Bot Kerja Kulit','Sepatu Loafer'],bag:['Tas Pos Kulit','Tas Punggung Kanvas'],acc:['Topi Bulu Pemburu','Ikat Pinggang Paku'],gem:['Kalung Elang Perak','Anting Salib Perak']};
const CSH={rtw:['coat','tee','hood','pants'],sepatu:['shoe'],tas:['bag'],aksesoris:['acc'],perhiasan:['gem']};
const dflt=(g,c)=>CSH[c].flatMap((s,j)=>AN[s].map((n,m)=>({n,s,p:350000+((j*5+m*3+(g==='pria'?0:2))%9)*325000})));
const catOf=t=>Object.keys(CSH).find(c=>CSH[c].includes(t))||'rtw';
const archItems=(g,c)=>ARCHDB?ARCHDB.filter(a=>a.season===g+':'+c||(!String(a.season).includes(':')&&catOf(a.s)===c)):dflt(g,c);

/* ===== header & menu ===== */
const H=$('header'),links=[...document.querySelectorAll('[data-g]')];let mg='pria';
function openMenu(x){mg=x;const L=x==='kronologi'?GEN:CATS;$('#mi').innerHTML=L.map(([k,l])=>`<a href="#/${x}/${k}">${l}</a>`).join('');links.forEach(a=>a.classList.toggle('on',a.dataset.g===x));H.classList.add('open')}
function closeMenu(){H.classList.remove('open')}
const TOUCH=()=>matchMedia('(hover:none)').matches;
links.forEach(a=>{
  a.addEventListener('mouseenter',()=>{if(!TOUCH())openMenu(a.dataset.g)});
  a.addEventListener('focus',()=>{if(!TOUCH())openMenu(a.dataset.g)});
  a.addEventListener('click',e=>{
    if(TOUCH()){e.preventDefault();if(H.classList.contains('open')&&mg===a.dataset.g)closeMenu();else openMenu(a.dataset.g)}
    else closeMenu();
  });
});
H.addEventListener('mouseleave',()=>{if(!TOUCH())closeMenu()});
H.addEventListener('focusout',e=>{if(!H.contains(e.relatedTarget))closeMenu()});
$('#menu').addEventListener('click',closeMenu);
document.addEventListener('click',e=>{if(!H.contains(e.target))closeMenu()});

/* ===== cart ===== */
let cart=[];
function openCart(){$('#drawer').classList.add('on');$('#drawer').setAttribute('aria-hidden','false');$('#scrim').classList.add('on')}
function closeCart(){$('#drawer').classList.remove('on');$('#drawer').setAttribute('aria-hidden','true');$('#scrim').classList.remove('on')}
$('#cartBtn').onclick=openCart;$('#dclose').onclick=closeCart;$('#scrim').onclick=closeCart;$('#dgo').onclick=closeCart;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeCart()}});
const subtotal=()=>cart.reduce((a,c)=>a+c.q*PM(c.id).p,0);
function drawCart(){
  const n=cart.reduce((a,c)=>a+c.q,0);
  $('#cn').textContent=n;$('#dsum').textContent=R(subtotal());$('#dgo').hidden=!n;
  $('#ditems').innerHTML=n?cart.map((c,k)=>{const i=PM(c.id);return `<div class="ditem"><div class="th">${pic(i)}</div><div><b>${esc(i.n)}</b><small>${c.z}</small><div class="qty"><button data-k="${k}" data-d="-1" aria-label="Kurangi">−</button>${c.q}<button data-k="${k}" data-d="1" aria-label="Tambah">+</button></div></div><span>${R(i.p*c.q)}</span></div>`}).join(''):'<p class="emp">Keranjang Anda kosong.</p>';
  if(!$('#checkout').hidden)renderCo();
}
$('#ditems').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=cart[b.dataset.k];c.q+=+b.dataset.d;if(c.q<1)cart.splice(b.dataset.k,1);drawCart()};

/* ===== daftar produk ===== */
let curG='pria',curC='baru',sortBy='new',fopen=false;
function renderShop(){
  if(!LOADED){$('#shop').innerHTML='<p class="note">Memuat…</p>';return}
  let L=ITEMS.filter(i=>i.g===curG&&(curC==='baru'?i.nw:i.c===curC));
  if(sortBy==='lo')L=[...L].sort((a,b)=>a.p-b.p);if(sortBy==='hi')L=[...L].sort((a,b)=>b.p-a.p);
  const opt=[['new','Terbaru'],['lo','Harga terendah'],['hi','Harga tertinggi']];
  $('#shop').innerHTML=`<div class="title"><h1>${curG==='pria'?'Pria':'Wanita'} &gt; ${CATS.find(x=>x[0]===curC)[1]}</h1><button class="btn-d" id="fb" aria-expanded="${fopen}">Filter</button></div>
  <div class="filters"${fopen?'':' hidden'}>${opt.map(([k,l])=>`<button data-sort="${k}" aria-pressed="${sortBy===k}">${l}</button>`).join('')}</div>
  <div class="grid3">${L.map(card).join('')}</div>${L.length?'':'<p class="note">Belum ada produk di kategori ini.</p>'}`;
}
$('#shop').onclick=e=>{
  if(e.target.closest('#fb')){fopen=!fopen;renderShop()}
  const s=e.target.closest('[data-sort]');if(s){sortBy=s.dataset.sort;renderShop()}
};

/* ===== detail produk ===== */
let pI=null,selZ=null;
function renderPdp(i){
  pI=i;const zs=SZ(i);selZ=zs.find((z,k)=>!sold(i,k));
  const rel=ITEMS.filter(x=>x.g===i.g&&x.id!==i.id).sort((a,b)=>{const n=ITEMS.length,x=ITEMS.indexOf(i);return((ITEMS.indexOf(a)-x+n)%n)-((ITEMS.indexOf(b)-x+n)%n)}).slice(0,5);
  $('#pdp').innerHTML=`<div class="pd"><div class="l"><h1>${esc(i.n)}</h1><p class="d">${esc(i.d||DS[i.s])}</p></div><div class="m">${pic(i)}</div>
  <div class="r"><div class="sz" id="sz">${zs.map((z,k)=>`<button ${sold(i,k)?'disabled':''} aria-pressed="${z===selZ}">${z}</button>`).join('')}</div><button class="btn-d" id="add">Tambah ke keranjang — ${R(i.p)}</button></div></div>
  <h2 class="rh">Terkait</h2><div class="grid5">${rel.map(card).join('')}</div>`;
}
$('#pdp').onclick=e=>{
  const z=e.target.closest('#sz button');
  if(z&&!z.disabled){selZ=z.textContent;document.querySelectorAll('#sz button').forEach(b=>b.setAttribute('aria-pressed',b===z))}
  if(e.target.closest('#add')&&selZ){
    const f=cart.find(c=>c.id===pI.id&&c.z===selZ);f?f.q++:cart.push({id:pI.id,z:selZ,q:1});drawCart();openCart();
  }
};

/* ===== kronologi (arsip terjual) ===== */
function renderKr(g){
  if(!LOADED){$('#kr').innerHTML='<p class="note">Memuat…</p>';return}
  g=g==='wanita'?'wanita':'pria';
  const rows=CATO.map(([c,l])=>({l,L:archItems(g,c)})).filter(r=>r.L.length);
  const head=`<div class="title"><h1>Kronologi &gt; ${g==='pria'?'Pria':'Wanita'}</h1></div><nav class="krt">${GEN.map(([k,l])=>`<a href="#/kronologi/${k}"${k===g?' aria-current="page"':''}>${l}</a>`).join('')}</nav>`;
  if(!rows.length){$('#kr').innerHTML=head+'<p class="note">Belum ada barang di arsip.</p>';return}
  const tile=i=>`<div class="ar"><div class="pimg">${pic(i)}</div><b>${esc(i.n)}</b><small>${R(i.p)}</small><em>Habis terjual</em></div>`;
  const row=({l,L})=>{let b=L;while(b.length<6)b=b.concat(L);const t=b.map(tile).join('');return `<h2 class="krh">${l}</h2><div class="car" aria-label="Arsip ${l}"><div class="track" style="--d:${b.length*4}s">${t}${t}</div></div>`};
  $('#kr').innerHTML=head+rows.map(row).join('')+'<p class="note">Arsip barang yang sudah terjual habis. Arahkan kursor untuk menghentikan gerakan.</p>';
}

/* ===== checkout ===== */
let step=1,info={},ship=25000,code='',dmsg='',orderNo='';
const SH=[['Reguler (3–5 hari kerja)',25000],['Ekspres (1–2 hari kerja)',60000]];
const PAY=['Transfer bank / virtual account','QRIS','Kartu kredit atau debit'];
const PROV=['Aceh','Sumatera Utara','Sumatera Barat','Riau','DKI Jakarta','Jawa Barat','Banten','Jawa Tengah','DI Yogyakarta','Jawa Timur','Bali','Kalimantan Timur','Sulawesi Selatan','Papua'];
const disc=()=>code==='X10'?Math.round(subtotal()*.1):0;
function sumHTML(){
  if(step===4)return '';
  const sub=subtotal(),d=disc(),sc=step>=2?ship:null,tot=sub-d+(sc||0);
  return `${cart.map(c=>{const i=PM(c.id);return `<div class="sl"><div class="th">${pic(i)}<i>${c.q}</i></div><div>${esc(i.n)}<small>${c.z}</small></div><span>${R(i.p*c.q)}</span></div>`}).join('')}
  <div class="dcode"><input id="dc" placeholder="Kode diskon" value="${esc(code)}" aria-label="Kode diskon"><button id="da" type="button">Pakai</button></div><p class="dm">${dmsg}</p>
  <div class="tr"><span>Subtotal</span><span>${R(sub)}</span></div>
  ${d?`<div class="tr"><span>Diskon</span><span>−${R(d)}</span></div>`:''}
  <div class="tr"><span>Pengiriman</span><span>${sc===null?'Dihitung di langkah berikutnya':R(sc)}</span></div>
  <div class="tr t"><span>Total</span><span><small>IDR</small> ${R(tot)}</span></div>`;
}
function leftHTML(){
  const bc=['Informasi','Pengiriman','Pembayaran'].map((l,k)=>step>k+1&&step<4?`<button data-s="${k+1}">${l}</button>`:`<span class="${step===k+1?'cu':''}">${l}</span>`).join('<span>›</span>');
  const head=`<a class="clogo" href="#/">X</a>`;
  if(step===4)return `${head}<div class="ok"><h2>Pesanan diterima</h2><p>Nomor pesanan ${orderNo}. Konfirmasi dikirim ke ${esc(info.email||'surel Anda')}.</p><p style="margin-top:24px"><a class="btn-d" href="#/">Kembali ke toko</a></p></div>`;
  if(!cart.length)return `${head}<p>Keranjang Anda kosong.</p><p style="margin-top:20px"><a class="btn-d" href="#/pria">Lanjut belanja</a></p>`;
  const adr=`${esc(info.address||'')}, ${esc(info.city||'')} ${esc(info.zip||'')}`;
  const top=`${head}<nav class="bc">${bc}</nav>`;
  if(step===1)return `${top}<div class="ex">Checkout cepat</div><div class="exb"><span style="background:#5a31f4">shop</span><span style="background:#ffc439;color:#253b80">PayPal</span><span style="background:#000">Apple Pay</span><span style="background:#000">G Pay</span></div><div class="or">ATAU</div>
  <form id="f1"><h3>Kontak</h3><input type="email" name="email" placeholder="Surel" required value="${esc(info.email||'')}"><label class="chk"><input type="checkbox" name="news"> Kirimi saya berita dan penawaran</label>
  <h3>Alamat pengiriman</h3><select name="country" aria-label="Negara"><option>Indonesia</option><option>Singapura</option><option>Malaysia</option></select>
  <div class="row"><input name="fn" placeholder="Nama depan (opsional)" value="${esc(info.fn||'')}"><input name="ln" placeholder="Nama belakang" required value="${esc(info.ln||'')}"></div>
  <input name="address" placeholder="Alamat" required value="${esc(info.address||'')}"><input name="apt" placeholder="Apartemen, unit, dll. (opsional)" value="${esc(info.apt||'')}">
  <div class="row"><input name="city" placeholder="Kota" required value="${esc(info.city||'')}"><select name="prov" aria-label="Provinsi">${PROV.map(p=>`<option>${p}</option>`).join('')}</select><input name="zip" placeholder="Kode pos" required value="${esc(info.zip||'')}"></div>
  <input name="phone" type="tel" placeholder="Telepon" value="${esc(info.phone||'')}"><div class="cfoot"><button class="cbtn">Lanjut ke pengiriman</button></div></form>`;
  const rows=`<div class="box"><div><span>Kontak</span><span>${esc(info.email)}</span></div><div><span>Kirim ke</span><span>${adr}</span></div></div>`;
  if(step===2)return `${top}${rows}<form id="f2"><h3>Metode pengiriman</h3>${SH.map(([l,c])=>`<label class="opt"><input type="radio" name="ship" value="${c}" ${c===ship?'checked':''}><span>${l}</span><span>${R(c)}</span></label>`).join('')}<div class="cfoot"><button class="cbtn">Lanjut ke pembayaran</button></div></form>`;
  return `${top}${rows}<form id="f3"><h3>Pembayaran</h3>${PAY.map((l,k)=>`<label class="opt"><input type="radio" name="pay" ${k?'':'checked'}><span>${l}</span></label>`).join('')}<div class="cfoot"><button class="cbtn">Bayar sekarang</button></div></form>`;
}
function renderCo(){$('#checkout').innerHTML=`<div class="cl"><div class="ci" id="cleft">${leftHTML()}</div></div><div class="cr"><div class="ci2" id="cright">${sumHTML()}</div></div>`}
$('#checkout').addEventListener('submit',e=>{
  e.preventDefault();const fd=new FormData(e.target);
  if(e.target.id==='f1'){info=Object.fromEntries(fd);step=2}
  else if(e.target.id==='f2'){ship=+fd.get('ship');step=3}
  else{orderNo='X-'+Math.floor(100000+Math.random()*900000);step=4;saveOrder();cart=[];drawCart();return scrollTo(0,0)}
  renderCo();scrollTo(0,0);
});
$('#checkout').addEventListener('click',e=>{
  const s=e.target.closest('[data-s]');if(s){step=+s.dataset.s;renderCo()}
  if(e.target.id==='da'){code=$('#dc').value.trim().toUpperCase();dmsg=code?(code==='X10'?'Diskon 10% diterapkan.':'Kode tidak valid.'):'';if(code!=='X10')code=code&&dmsg?code:'';$('#cright').innerHTML=sumHTML()}
});

/* ===== router ===== */
function route(keep){
  const p=location.hash.replace(/^#\/?/,'').split('/'),k=p[0];
  const IT=k==='p'?PM(p[1]):null;
  const gd=(k==='pria'||k==='wanita')?k:(IT?IT.g:null);
  const page=IT?'pdp':gd?'shop':k==='kronologi'?'kr':k==='checkout'?'checkout':k==='admin'?'admin':'home';
  ['home','shop','pdp','kr','checkout','admin'].forEach(x=>$('#'+x).hidden=x!==page);
  document.body.classList.toggle('light',page!=='home');
  document.body.classList.toggle('co',page==='checkout');
  if(!keep){closeMenu();closeCart()}
  const cur=gd||(k==='kronologi'?'kronologi':'');
  links.forEach(a=>a.classList.toggle('cur',a.dataset.g===cur));
  if(page==='shop'){curG=gd;curC=CATS.some(x=>x[0]===p[1])?p[1]:'baru';fopen=keep?fopen:false;renderShop()}
  if(page==='pdp')renderPdp(IT);
  if(page==='kr')renderKr(p[1]);
  if(page==='checkout'&&!keep){if(step===4)step=1;renderCo()}
  if(page==='admin'&&!(keep&&ED))renderAdmin();
  if(!keep)scrollTo(0,0);
}
addEventListener('hashchange',()=>route());drawCart();

/* ===== video & tampilan ===== */
const D0M='media/hero-pria.jpg',D0W='media/hero-wanita.jpg';let curV=null,CFGOK=false;
function setVideo(src){
  if(src===curV)return;curV=src;
  const f=$('#film'),b=$('#snd'),o=f.querySelector('video');if(o)o.remove();
  f.classList.remove('real');b.hidden=true;if(!src)return;
  const v=document.createElement('video');
  v.className='vid';v.autoplay=true;v.loop=true;v.muted=true;v.playsInline=true;v.setAttribute('muted','');v.setAttribute('playsinline','');v.preload='none';
  f.append(v);
  v.addEventListener('loadeddata',()=>{f.classList.add('real');v.classList.add('on');b.hidden=false});
  const go=()=>{v.src=src;const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{})};
  if('IntersectionObserver' in window){const io=new IntersectionObserver((es,o)=>{if(es.some(e=>e.isIntersecting)){o.disconnect();go()}},{rootMargin:'0px 0px -40px 0px'});io.observe(f)}else go();
  v.addEventListener('error',()=>{v.remove();f.classList.remove('real');b.hidden=true});
}
$('#snd').onclick=()=>{const v=$('#film video');if(v){v.muted=!v.muted;$('#snd').setAttribute('aria-pressed',String(!v.muted))}};
const MQ=matchMedia('(max-width:860px)');
const pickVideo=()=>(MQ.matches&&CFG.videoM)||CFG.video||VIDEO_SRC;
MQ.addEventListener?MQ.addEventListener('change',()=>applyCfg()):MQ.addListener(()=>applyCfg());
function setImg(el,src){if(el.dataset.s===src)return;el.dataset.s=src;el.classList.remove('on');el.onload=el.onerror=()=>el.classList.add('on');el.src=src}
function applyCfg(){if(!CFGOK)return;setImg($('#hM'),CFG.heroM||D0M);setImg($('#hW'),CFG.heroW||D0W);setVideo(pickVideo())}
try{const c=localStorage.getItem('x_cfg');if(c){CFG=JSON.parse(c)||{};CFGOK=true}}catch(e){}
setTimeout(()=>{if(!CFGOK){CFGOK=true;applyCfg()}},3500);
applyCfg();

/* ===== pesanan ===== */
function saveOrder(){
  if(!sb)return;
  const items=cart.map(c=>{const i=PM(c.id);return{id:String(c.id),n:i.n,z:c.z,q:c.q,p:i.p}});
  sb.from('orders').insert({no:orderNo,items,total:subtotal()-disc()+ship,info,ship,status:'baru',ts:Date.now()}).then(()=>{});

/* ===== dashboard admin (#/admin) ===== */
const TIPE=[['coat','Mantel / jaket'],['tee','Kaos'],['hood','Hoodie'],['pants','Celana'],['shoe','Sepatu'],['bag','Tas'],['acc','Aksesoris'],['gem','Perhiasan']];
const GEN=[['pria','Pria'],['wanita','Wanita']],CATO=CATS.slice(1);
const csv=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
let AT='produk',ED=null,CD='',FL='',LERR='',CA='';
const fi=(l,n,v,t='text')=>`<label class="af">${l}<input name="${n}" type="${t}" value="${esc(v??'')}"></label>`;
const fs=(l,n,o,v)=>`<label class="af">${l}<select name="${n}">${o.map(([k,t])=>`<option value="${k}"${k===v?' selected':''}>${t}</option>`).join('')}</select></label>`;
const fc=(l,n,v)=>`<label class="af"><input type="checkbox" name="${n}"${v?' checked':''}> ${l}</label>`;
const photoF=u=>`<div class="af">Foto<div class="pv" id="pv">${u?`<img src="${esc(u)}" alt="">`:'Belum ada'}</div><input type="file" accept="image/*" id="pf"><input type="hidden" name="img" value="${esc(u||'')}"> <button type="button" data-a="rmimg">Hapus foto</button></div>`;
function formHTML(){
  const d=ED.data,btn='<div class="bar2"><button class="btn-d">Simpan</button><button type="button" class="btn-l" data-a="cancel">Batal</button></div>';
  if(ED.kind==='p')return `<form id="af"><h3 class="fh">${ED.isNew?'Produk baru':'Ubah produk'}</h3><div class="afg">${fi('Nama','n',d.n)}${fi('Harga (Rp)','p',d.p,'number')}${fs('Untuk','g',GEN,d.g)}${fs('Kategori','c',CATO,d.c)}${fs('Tipe barang','s',TIPE,d.s)}${fi('Ukuran (pisah koma, kosong = bawaan)','z',(d.z||[]).join(', '))}${fi('Ukuran habis (pisah koma)','x',(d.x||[]).join(', '))}<div>${fc('Tampil di Koleksi Baru','nw',d.nw)}${fc('Sembunyikan dari toko','hidden',d.hidden)}</div></div><label class="af">Deskripsi<textarea name="d">${esc(d.d||'')}</textarea></label>${photoF(d.img)}${btn}</form>`;
  return `<form id="af"><h3 class="fh">${ED.isNew?'Barang arsip baru':'Ubah barang arsip'}</h3><div class="afg">${fi('Nama','n',d.n)}${fi('Harga (Rp)','p',d.p,'number')}${fs('Untuk','g',GEN,String(d.season||'').split(':')[0]||'pria')}${fs('Kategori','c',CATO,String(d.season||'').split(':')[1]||catOf(d.s))}${fs('Tipe barang','s',TIPE,d.s)}</div>${photoF(d.img)}${btn}</form>`;
}
const row=(i,sub,acts)=>`<div class="ar2"><div class="t">${pic(i)}</div><div>${esc(i.n)}<small>${sub}</small></div><div class="ac">${acts}</div></div>`;
const acts=i=>`<button data-a="edit" data-id="${i.id}">Ubah</button><button data-a="del" data-id="${i.id}">${CD===i.id?'Yakin hapus?':'Hapus'}</button>`;
const archLabel=s=>{const [g,c]=String(s||'').split(':'),cn=(CATO.find(x=>x[0]===c)||[])[1];return cn?`${g} · ${cn}`:'format lama · tampil di Pria dan Wanita (ubah untuk memilih)'};
const daBtn=(k,n)=>n&&CA!==k?`<button class="btn-l danger" data-a="delask" data-k="${k}">Hapus semua</button>`:'';
const daWarn=(k,n)=>n&&CA===k?`<div class="warn"><span>Hapus semua ${n} data ini? Tidak bisa dibatalkan.</span><button class="btn-d" data-a="delall" data-k="${k}">Ya, hapus semua</button><button class="btn-l" data-a="delno">Batal</button></div>`:'';
function listP(){
  return `<div class="bar2"><button class="btn-d" data-a="new">+ Produk baru</button>${ALL.length?'':'<button class="btn-l" data-a="seed">Impor produk contoh</button>'}${daBtn('products',ALL.length)}</div>${daWarn('products',ALL.length)}`+
  (ALL.length?ALL.map(i=>row(i,`${i.g} · ${(CATS.find(c=>c[0]===i.c)||[0,i.c])[1]} · ${R(i.p||0)}${i.nw?' · Baru':''}${i.hidden?' · Disembunyikan':''}`,acts(i))).join(''):'<p class="note">Belum ada produk. Toko tampil kosong sampai Anda menambah atau mengimpor produk.</p>');
}
function listK(){
  return `<div class="bar2"><button class="btn-d" data-a="new">+ Barang arsip</button>${ARC.length?'':'<button class="btn-l" data-a="seedA">Impor arsip contoh</button>'}${daBtn('archive',ARC.length)}</div>${daWarn('archive',ARC.length)}`+
  (ARC.length?ARC.map(i=>row(i,`${archLabel(i.season)} · ${R(i.p||0)}`,acts(i))).join(''):'<p class="note">Belum ada arsip. Halaman Kronologi tampil kosong sampai Anda menambah atau mengimpor arsip.</p>');
}
function listT(){
  const f=(k,l,v)=>`<div class="af">${l}<div class="pv">${CFG[k]?(v?`<video src="${esc(CFG[k])}" muted></video>`:`<img src="${esc(CFG[k])}" alt="">`):'Bawaan'}</div><input type="file" accept="${v?'video/*':'image/*'}" data-cfg="${k}"> ${CFG[k]?`<button data-a="rcfg" data-k="${k}">Pakai bawaan</button>`:''}</div>`;
  return `<div class="afg">${f('heroM','Foto hero Pria')}${f('heroW','Foto hero Wanita')}${f('video','Video laptop (mp4, maks 20 MB)',1)}${f('videoM','Video khusus HP (potret 9:16, mp4)',1)}</div>`;
}
function listO(){
  return (ORDERS.length?`<div class="bar2">${daBtn('orders',ORDERS.length)}</div>${daWarn('orders',ORDERS.length)}`:'')+(ORDERS.length?ORDERS.map(o=>{const n=o.info||{};return `<div class="ar2"><div></div><div>${esc(o.no)} · ${esc((n.fn||'')+' '+(n.ln||''))}<small>${new Date(o.ts).toLocaleString('id-ID')} · ${R(o.total||0)} · ${(o.items||[]).map(x=>esc(x.n)+' ('+esc(x.z)+') ×'+x.q).join(', ')}<br>${esc(n.address||'')}, ${esc(n.city||'')} ${esc(n.zip||'')} · ${esc(n.email||'')} · ${esc(n.phone||'')}</small></div><select data-st="${o.id}">${['baru','diproses','dikirim','selesai'].map(s=>`<option${s===o.status?' selected':''}>${s}</option>`).join('')}</select></div>`}).join(''):'<p class="note">Belum ada pesanan.</p>');
}
function renderAdmin(){
  const el=$('#admin'),head='<div class="title"><h1>Dashboard</h1><a class="btn-d" href="#/">Lihat toko</a></div>';
  if(!sb){el.innerHTML=head+'<p class="note">Dashboard belum terhubung. Isi config.js dengan data Supabase Anda (lihat README).</p>';return}
  if(!CAN){el.innerHTML=head+`<form id="lg" class="afg"><h3 class="fh" style="grid-column:1/-1">Masuk admin</h3>${fi('Surel','email','','email')}${fi('Kata sandi','password','','password')}<div class="bar2" style="grid-column:1/-1"><button class="btn-d">Masuk</button></div>${LERR?`<p class="flash">${esc(LERR)}</p>`:''}</form>`;return}
  const tabs=[['produk','Produk'],['kronologi','Kronologi'],['tampilan','Tampilan'],['pesanan','Pesanan']],fl=FL;FL='';
  const body=ED?formHTML():AT==='produk'?listP():AT==='kronologi'?listK():AT==='tampilan'?listT():listO();
  el.innerHTML=head+`<nav class="atabs">${tabs.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${AT===k}">${l}</button>`).join('')}<button data-a="out">Keluar</button></nav>${fl?`<p class="flash">${esc(fl)}</p>`:''}${body}`;
}
const flash=m=>{FL=m;renderAdmin()};
const ok=async q=>{const {error}=await q;if(error)throw error};
async function shrink(f,max){
  if(!/^image\/(jpe?g|png|webp)$/.test(f.type))return f;
  try{
    const bm=await createImageBitmap(f),k=Math.min(1,max/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const t=await new Promise(r=>c.toBlob(r,'image/webp',.82));
    return t&&t.size<f.size?new File([t],f.name.replace(/\.\w+$/,'')+'.webp',{type:'image/webp'}):f;
  }catch(e){return f}
}
const up=async f=>{f=await shrink(f,1600);const n=Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error}=await sb.storage.from('media').upload(n,f,{contentType:f.type,cacheControl:'31536000'});if(error)throw error;return sb.storage.from('media').getPublicUrl(n).data.publicUrl};
async function seed(kind){
  flash('Mengimpor…');
  if(kind==='p')await ok(sb.from('products').upsert(DEF.map(({id,nw,...d})=>({id:'d'+id,nw:!!nw,...d}))));
  else{const rows=[];GEN.forEach(([g])=>CATO.forEach(([c])=>dflt(g,c).forEach((a,j)=>rows.push({...a,id:`d-${g}-${c}-${j}`,season:g+':'+c}))));await ok(sb.from('archive').upsert(rows))}
  await loadAll();flash('Selesai diimpor');
}
$('#admin').addEventListener('click',async e=>{
  const t=e.target.closest('[data-a],[data-tab]');if(!t)return;
  if(t.dataset.tab){AT=t.dataset.tab;ED=null;CD='';CA='';return renderAdmin()}
  const a=t.dataset.a,id=t.dataset.id,isP=AT==='produk';
  try{
    if(a==='new'){ED=isP?{kind:'p',isNew:1,id:'p'+Date.now().toString(36),data:{g:'pria',c:'rtw',s:'tee',p:0}}:{kind:'a',isNew:1,id:'a'+Date.now().toString(36),data:{season:'pria:rtw',s:'tee',p:0}};renderAdmin()}
    else if(a==='edit'){ED={kind:isP?'p':'a',id,data:{...(isP?ALL:ARC).find(x=>x.id===id)}};renderAdmin()}
    else if(a==='cancel'){ED=null;renderAdmin()}
    else if(a==='del'){if(CD!==id){CD=id;renderAdmin()}else{await ok(sb.from(isP?'products':'archive').delete().eq('id',id));CD='';await loadAll();flash('Dihapus')}}
    else if(a==='rmimg'){document.querySelector('[name=img]').value='';$('#pv').textContent='Belum ada'}
    else if(a==='rcfg'){const c={...CFG};delete c[t.dataset.k];await setCfg(c);flash('Dikembalikan ke bawaan')}
    else if(a==='out'){await sb.auth.signOut();ED=null}
    else if(a==='delask'){CA=t.dataset.k;CD='';renderAdmin()}
    else if(a==='delno'){CA='';renderAdmin()}
    else if(a==='delall'){const k=t.dataset.k;await ok(sb.from(k).delete().not('id','is',null));CA='';await loadAll();flash('Semua data dihapus')}
    else if(a==='seed')await seed('p');
    else if(a==='seedA')await seed('a');
  }catch(err){flash('Gagal: '+(err.message||err.code||err))}
});
$('#admin').addEventListener('change',async e=>{
  const t=e.target;
  try{
    if(t.id==='pf'&&t.files[0]){$('#pv').textContent='Mengunggah…';const u=await up(t.files[0]);document.querySelector('[name=img]').value=u;$('#pv').innerHTML=`<img src="${esc(u)}" alt="">`}
    else if(t.dataset.cfg&&t.files[0]){FL='Mengunggah…';renderAdmin();const u=await up(t.files[0]);await setCfg({...CFG,[t.dataset.cfg]:u});flash('Tersimpan')}
    else if(t.dataset.st){await ok(sb.from('orders').update({status:t.value}).eq('id',t.dataset.st))}
  }catch(err){flash('Gagal: '+(err.message||err.code||err))}
});
$('#admin').addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='lg'){const g=new FormData(e.target);const {error}=await sb.auth.signInWithPassword({email:g.get('email'),password:g.get('password')});LERR=error?'Surel atau kata sandi salah.':'';renderAdmin();return}
  const f=new FormData(e.target),p=ED.kind==='p';
  const base={n:String(f.get('n')).trim(),p:Math.max(0,+f.get('p')||0),s:f.get('s'),img:f.get('img')||''};
  const data=p?{...base,g:f.get('g'),c:f.get('c'),nw:!!f.get('nw'),hidden:!!f.get('hidden'),d:String(f.get('d')).trim(),z:csv(f.get('z')),x:csv(f.get('x'))}:{...base,season:f.get('g')+':'+f.get('c')};
  try{await ok(sb.from(p?'products':'archive').upsert({id:ED.id,...data}));ED=null;await loadAll();flash('Tersimpan')}catch(err){flash('Gagal menyimpan: '+(err.message||err.code||err))}
});

/* ===== Supabase ===== */
function refresh(){cart=cart.filter(c=>PM(c.id));if($('#checkout').hidden)drawCart();route(true)}
const CF=window.X_CONFIG||{};
const sb=(window.supabase&&CF.SUPABASE_URL&&CF.SUPABASE_ANON_KEY)?supabase.createClient(CF.SUPABASE_URL,CF.SUPABASE_ANON_KEY):null;
if(sb){ITEMS=[];ARCHDB=[];LOADED=false}else{CFGOK=true;applyCfg()}
async function setCfg(c){await ok(sb.from('site').upsert({id:'config',data:c}));await loadAll()}
async function loadAll(){
  if(!sb)return;
  try{
    const [p,a,c]=await Promise.all([sb.from('products').select('*').order('created_at'),sb.from('archive').select('*').order('created_at'),sb.from('site').select('data').eq('id','config').maybeSingle()]);
    if(!p.error){ALL=p.data;ITEMS=ALL.filter(x=>!x.hidden)}else ITEMS=DEF
    if(!a.error){ARC=a.data;ARCHDB=ARC}else ARCHDB=null
    if(!c.error){CFG=(c.data&&c.data.data)||{};try{localStorage.setItem('x_cfg',JSON.stringify(CFG))}catch(e){}}
    if(CAN){const o=await sb.from('orders').select('*').order('ts',{ascending:false});if(!o.error)ORDERS=o.data}
  }catch(e){if(!ITEMS.length)ITEMS=DEF;if(ARCHDB&&!ARCHDB.length)ARCHDB=null}
  LOADED=true;CFGOK=true;applyCfg();refresh();
}
if(sb){
  sb.auth.getSession().then(({data})=>{CAN=!!data.session;loadAll()});
  sb.auth.onAuthStateChange((_e,x)=>{const was=CAN;CAN=!!x;if(was!==CAN)loadAll()});
}

/* mulai: dijalankan terakhir supaya semua bagian sudah siap */
route();

});
</script>
